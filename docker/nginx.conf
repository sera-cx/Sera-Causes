server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API and everything the API serves directly (for same-origin deployments).
    location /api/        { proxy_pass http://api:3001; }
    location /photos/     { proxy_pass http://api:3001; }
    location /uploads/    { proxy_pass http://api:3001; }
    location /results/    { proxy_pass http://api:3001; }
    location = /embed.js       { proxy_pass http://api:3001; }
    location = /snapshot.json  { proxy_pass http://api:3001; }
    location = /health         { proxy_pass http://api:3001; }

    # Hashed static assets are immutable.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
